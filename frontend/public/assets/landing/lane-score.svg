<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Model scoring pipeline strip">
  <defs>
    <linearGradient id="g-score-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1124"/>
      <stop offset="100%" stop-color="#0b1626"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#g-score-bg)"/>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#9bb6e8" letter-spacing="1.4">
    <text x="24" y="34">SCORE</text>
  </g>
  <g>
    <rect x="24" y="60" width="170" height="200" fill="rgba(110,168,254,0.1)" stroke="rgba(110,168,254,0.4)"/>
    <text x="40" y="86" font-family="ui-monospace, monospace" font-size="11" fill="#6ea8fe" letter-spacing="1.2">TABULAR</text>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#b6c5e8">
      <text x="40" y="118">features · 47</text>
      <text x="40" y="138">XGBoost head</text>
      <text x="40" y="158">raw_score · 0.612</text>
      <text x="40" y="178">tree_count · 320</text>
      <text x="40" y="198">depth · 6</text>
      <text x="40" y="218">lr · 0.05</text>
    </g>
  </g>
  <g>
    <rect x="216" y="60" width="170" height="200" fill="rgba(142,68,173,0.1)" stroke="rgba(142,68,173,0.4)"/>
    <text x="232" y="86" font-family="ui-monospace, monospace" font-size="11" fill="#a371d8" letter-spacing="1.2">GRAPH</text>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#b6c5e8">
      <text x="232" y="118">GraphSAGE · 2-layer</text>
      <text x="232" y="138">embed_dim · 64</text>
      <text x="232" y="158">neighbors · 10, 10</text>
      <text x="232" y="178">raw_score · 0.681</text>
      <text x="232" y="198">fallback · sklearn</text>
      <text x="232" y="218">encoder · GIN-style</text>
    </g>
  </g>
  <g>
    <rect x="408" y="60" width="170" height="200" fill="rgba(47,191,113,0.1)" stroke="rgba(47,191,113,0.4)"/>
    <text x="424" y="86" font-family="ui-monospace, monospace" font-size="11" fill="#2fbf71" letter-spacing="1.2">CALIBRATED</text>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#b6c5e8">
      <text x="424" y="118">isotonic · 5-fold</text>
      <text x="424" y="138">calibrated · 0.704</text>
      <text x="424" y="158">ECE · 0.031</text>
      <text x="424" y="178">Brier · 0.087</text>
      <text x="424" y="198">band · medium</text>
      <text x="424" y="218">interval · [0.41,0.88]</text>
    </g>
  </g>
  <g stroke="rgba(110,168,254,0.4)" stroke-width="1.4" fill="none">
    <line x1="194" y1="160" x2="216" y2="160"/>
    <line x1="386" y1="160" x2="408" y2="160"/>
  </g>
</svg>
