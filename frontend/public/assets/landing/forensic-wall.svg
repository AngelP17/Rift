<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Forensic operations backdrop">
  <defs>
    <linearGradient id="g-wall-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1124"/>
      <stop offset="50%" stop-color="#070c19"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>
    <radialGradient id="g-wall-glow-blue" cx="0.2" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="rgba(110,168,254,0.18)"/>
      <stop offset="100%" stop-color="rgba(110,168,254,0)"/>
    </radialGradient>
    <radialGradient id="g-wall-glow-green" cx="0.85" cy="0.15" r="0.4">
      <stop offset="0%" stop-color="rgba(47,191,113,0.12)"/>
      <stop offset="100%" stop-color="rgba(47,191,113,0)"/>
    </radialGradient>
    <pattern id="g-wall-grid" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="rgba(110,168,254,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#g-wall-bg)"/>
  <rect width="1920" height="1080" fill="url(#g-wall-grid)"/>
  <rect width="1920" height="1080" fill="url(#g-wall-glow-blue)"/>
  <rect width="1920" height="1080" fill="url(#g-wall-glow-green)"/>

  <g stroke="rgba(110,168,254,0.18)" fill="none">
    <line x1="0" y1="320" x2="1920" y2="320"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="1080"/>
    <line x1="1280" y1="0" x2="1280" y2="1080"/>
  </g>

  <g font-family="ui-monospace, monospace" font-size="11" fill="#5a78a8" letter-spacing="1.6">
    <text x="80" y="60">rift · evidence console</text>
    <text x="1840" y="60" text-anchor="end">v0.1.0</text>
  </g>
</svg>
