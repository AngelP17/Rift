<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Local OSS stack diagram">
  <defs>
    <linearGradient id="g-stack-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1124"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="g-stack-layer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(110,168,254,0.12)"/>
      <stop offset="100%" stop-color="rgba(110,168,254,0.02)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#g-stack-bg)"/>

  <g font-family="ui-monospace, monospace" font-size="11" fill="#9bb6e8" letter-spacing="1.6">
    <text x="80" y="60">LOCAL STACK · ZERO MANAGED SERVICES</text>
  </g>

  <g>
    <rect x="80" y="120" width="1040" height="120" fill="url(#g-stack-layer)" stroke="rgba(110,168,254,0.32)"/>
    <text x="120" y="160" font-family="ui-monospace, monospace" font-size="14" fill="#f3f6ff" letter-spacing="0.6">DATA</text>
    <g font-family="ui-monospace, monospace" font-size="13" fill="#b6c5e8">
      <text x="120" y="200">DuckDB lakehouse · Parquet snapshots · bronze / silver / gold</text>
    </g>
  </g>

  <g>
    <rect x="80" y="270" width="1040" height="120" fill="url(#g-stack-layer)" stroke="rgba(47,191,113,0.32)"/>
    <text x="120" y="310" font-family="ui-monospace, monospace" font-size="14" fill="#f3f6ff" letter-spacing="0.6">FEATURES</text>
    <g font-family="ui-monospace, monospace" font-size="13" fill="#b6c5e8">
      <text x="120" y="350">Polars transforms · temporal windows · graph neighborhood aggregations</text>
    </g>
  </g>

  <g>
    <rect x="80" y="420" width="1040" height="120" fill="url(#g-stack-layer)" stroke="rgba(243,156,18,0.32)"/>
    <text x="120" y="460" font-family="ui-monospace, monospace" font-size="14" fill="#f3f6ff" letter-spacing="0.6">MODEL</text>
    <g font-family="ui-monospace, monospace" font-size="13" fill="#b6c5e8">
      <text x="120" y="500">PyTorch GraphSAGE encoder · XGBoost head · scikit-learn calibration</text>
    </g>
  </g>

  <g>
    <rect x="80" y="570" width="1040" height="120" fill="url(#g-stack-layer)" stroke="rgba(142,68,173,0.32)"/>
    <text x="120" y="610" font-family="ui-monospace, monospace" font-size="14" fill="#f3f6ff" letter-spacing="0.6">API</text>
    <g font-family="ui-monospace, monospace" font-size="13" fill="#b6c5e8">
      <text x="120" y="650">FastAPI service · OpenAPI · /predict /replay /audit /metrics/latest</text>
    </g>
  </g>

  <g>
    <rect x="80" y="720" width="1040" height="120" fill="url(#g-stack-layer)" stroke="rgba(231,76,60,0.32)"/>
    <text x="120" y="760" font-family="ui-monospace, monospace" font-size="14" fill="#f3f6ff" letter-spacing="0.6">CONSOLE</text>
    <g font-family="ui-monospace, monospace" font-size="13" fill="#b6c5e8">
      <text x="120" y="800">Next.js dashboard · Recharts · GSAP · TanStack Table · SWR</text>
    </g>
  </g>

  <g stroke="rgba(110,168,254,0.45)" stroke-width="1.4" fill="none">
    <line x1="600" y1="240" x2="600" y2="270"/>
    <line x1="600" y1="390" x2="600" y2="420"/>
    <line x1="600" y1="540" x2="600" y2="570"/>
    <line x1="600" y1="690" x2="600" y2="720"/>
  </g>
</svg>
