<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Heterogeneous transaction graph">
  <defs>
    <linearGradient id="g-topo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1224"/>
      <stop offset="100%" stop-color="#070c19"/>
    </linearGradient>
    <linearGradient id="g-topo-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ea8fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2fbf71" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="g-topo-node-tx" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f3f6ff"/>
      <stop offset="100%" stop-color="#9bb6e8" stop-opacity="0.6"/>
    </radialGradient>
    <pattern id="g-topo-grid" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(110,168,254,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#g-topo-bg)"/>
  <rect width="1200" height="800" fill="url(#g-topo-grid)"/>

  <g stroke="url(#g-topo-edge)" stroke-width="1.4" fill="none" opacity="0.85">
    <line x1="220" y1="220" x2="600" y2="400"/>
    <line x1="600" y1="400" x2="980" y2="240"/>
    <line x1="600" y1="400" x2="1040" y2="540"/>
    <line x1="220" y1="220" x2="380" y2="600"/>
    <line x1="380" y1="600" x2="1040" y2="540"/>
    <line x1="600" y1="400" x2="380" y2="600"/>
    <line x1="980" y1="240" x2="1040" y2="540"/>
    <line x1="220" y1="220" x2="980" y2="240"/>
    <line x1="380" y1="600" x2="220" y2="220" stroke-dasharray="4 8"/>
    <line x1="600" y1="400" x2="220" y2="700" stroke-dasharray="4 8"/>
  </g>

  <g font-family="ui-monospace, monospace" font-size="11" fill="#9bb6e8" letter-spacing="1.4">
    <g>
      <circle cx="220" cy="220" r="38" fill="rgba(110,168,254,0.18)" stroke="rgba(110,168,254,0.6)"/>
      <circle cx="220" cy="220" r="6" fill="#6ea8fe"/>
      <text x="195" y="285" text-anchor="middle">DEVICE</text>
    </g>
    <g>
      <circle cx="600" cy="400" r="58" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.55)"/>
      <circle cx="600" cy="400" r="10" fill="#f3f6ff"/>
      <text x="600" y="490" text-anchor="middle">TX_NODE</text>
    </g>
    <g>
      <circle cx="980" cy="240" r="34" fill="rgba(47,191,113,0.18)" stroke="rgba(47,191,113,0.65)"/>
      <circle cx="980" cy="240" r="6" fill="#2fbf71"/>
      <text x="980" y="300" text-anchor="middle">MERCHANT</text>
    </g>
    <g>
      <circle cx="1040" cy="540" r="32" fill="rgba(243,156,18,0.18)" stroke="rgba(243,156,18,0.65)"/>
      <circle cx="1040" cy="540" r="6" fill="#f39c12"/>
      <text x="1040" y="598" text-anchor="middle">ACCOUNT</text>
    </g>
    <g>
      <circle cx="380" cy="600" r="32" fill="rgba(142,68,173,0.18)" stroke="rgba(142,68,173,0.65)"/>
      <circle cx="380" cy="600" r="6" fill="#a371d8"/>
      <text x="380" y="658" text-anchor="middle">USER</text>
    </g>
    <g>
      <circle cx="220" cy="700" r="26" fill="rgba(110,168,254,0.12)" stroke="rgba(110,168,254,0.5)"/>
      <circle cx="220" cy="700" r="5" fill="#6ea8fe"/>
      <text x="220" y="752" text-anchor="middle">DEVICE</text>
    </g>
  </g>

  <g font-family="ui-monospace, monospace" font-size="10" fill="#5a78a8">
    <text x="40" y="60">graph.snapshot --entities=6 --edges=10</text>
    <text x="40" y="78">window: 7d · confidence: 0.94</text>
  </g>
</svg>
