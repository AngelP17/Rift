<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Decision hash pill">
  <defs>
    <linearGradient id="g-pill-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1124"/>
      <stop offset="100%" stop-color="#0b1626"/>
    </linearGradient>
  </defs>
  <rect width="600" height="300" fill="url(#g-pill-bg)"/>
  <g font-family="ui-monospace, monospace" font-size="11" fill="#9bb6e8" letter-spacing="1.4">
    <text x="30" y="56">DECISION HASH</text>
  </g>
  <g>
    <rect x="30" y="90" width="540" height="120" fill="rgba(110,168,254,0.08)" stroke="rgba(110,168,254,0.4)"/>
    <g font-family="ui-monospace, monospace" font-size="22" fill="#f3f6ff" letter-spacing="2.4">
      <text x="50" y="138">6a4f · 9b12 · cd5e</text>
      <text x="50" y="174">7f80 · 31a2 · e2c8</text>
    </g>
    <g font-family="ui-monospace, monospace" font-size="11" fill="#5a78a8">
      <text x="50" y="196">sha-256 · deterministic · replayable</text>
    </g>
  </g>
  <g font-family="ui-monospace, monospace" font-size="10" fill="#2fbf71" letter-spacing="1.2">
    <text x="30" y="244">VERIFIED · LOCAL ARTIFACTS</text>
  </g>
