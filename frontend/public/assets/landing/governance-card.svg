      <text x="740" y="242">the green band for ECE and Brier, and the</text>
      <text x="740" y="266">conformal triage band flagged 5.5% of the</text>
      <text x="740" y="290">scored stream for human review without</text>
      <text x="740" y="314">spilling into the auto-approve band.</text>
      <text x="740" y="370">Channel-level fairness was re-checked</text>
      <text x="740" y="394">against the latest decision window. The</text>
      <text x="740" y="418">demographic parity difference (0.037) and</text>
      <text x="740" y="442">disparate impact ratio (0.91) sit inside the</text>
      <text x="740" y="466">policy band. No remediation was triggered.</text>
      <text x="740" y="524">Drift on amount_z and channel_density is</text>
      <text x="740" y="548">moderate but below the retrain threshold.</text>
      <text x="740" y="572">The next drift window is scheduled for</text>
      <text x="740" y="596">2026-05-09; no model swap is required now.</text>
