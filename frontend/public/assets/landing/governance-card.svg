    <text x="100" y="130" font-family="ui-monospace, monospace" font-size="12" fill="#9bb6e8" letter-spacing="1.4">METRICS</text>
    <g font-family="ui-monospace, monospace" font-size="14" fill="#f3f6ff">
      <text x="100" y="170">PR-AUC</text>
      <text x="320" y="170" fill="#2fbf71">0.912</text>
      <text x="100" y="200">ECE</text>
      <text x="320" y="200" fill="#2fbf71">0.031</text>
      <text x="100" y="230">Brier</text>
      <text x="320" y="230" fill="#2fbf71">0.087</text>
      <text x="100" y="260">Recall@1% FPR</text>
      <text x="320" y="260" fill="#2fbf71">0.472</text>
      <text x="100" y="290">Coverage</text>
      <text x="320" y="290" fill="#9bb6e8">93.2%</text>
    </g>
    <g font-family="ui-monospace, monospace" font-size="10" fill="#5a78a8">
      <text x="450" y="170">target ≥ 0.85 · within band</text>
      <text x="450" y="200">target ≤ 0.05 · within band</text>
      <text x="450" y="230">target ≤ 0.12 · within band</text>
      <text x="450" y="260">target ≥ 0.40 · within band</text>
      <text x="450" y="290">derived from review_rate</text>
    </g>
  </g>

  <g>
    <rect x="80" y="350" width="600" height="180" fill="none" stroke="rgba(243,156,18,0.32)"/>
    <text x="100" y="380" font-family="ui-monospace, monospace" font-size="12" fill="#f39c12" letter-spacing="1.4">FAIRNESS · CHANNEL</text>
    <g font-family="ui-monospace, monospace" font-size="13" fill="#f3f6ff">
      <text x="100" y="410">demographic_parity_difference</text>
      <text x="560" y="410" fill="#2fbf71" text-anchor="end">0.037</text>
      <text x="100" y="440">disparate_impact_ratio</text>
      <text x="560" y="440" fill="#2fbf71" text-anchor="end">0.91</text>
      <text x="100" y="470">equal_opportunity_difference</text>
      <text x="560" y="470" fill="#2fbf71" text-anchor="end">0.029</text>
      <text x="100" y="500">audited_at</text>
      <text x="560" y="500" fill="#9bb6e8" text-anchor="end">2026-05-01</text>
    </g>
  </g>

  <g>
    <rect x="80" y="560" width="600" height="240" fill="none" stroke="rgba(47,191,113,0.32)"/>
    <text x="100" y="590" font-family="ui-monospace, monospace" font-size="12" fill="#2fbf71" letter-spacing="1.4">DRIFT</text>
    <g>
      <rect x="100" y="620" width="560" height="20" fill="rgba(110,168,254,0.08)"/>
      <rect x="100" y="620" width="78" height="20" fill="#2fbf71" opacity="0.7"/>
      <text x="688" y="635" font-family="ui-monospace, monospace" font-size="11" fill="#9bb6e8">0.128 / 0.20</text>
