      <stop offset="0%" stop-color="#0a1124"/>
      <stop offset="100%" stop-color="#070b18"/>
    </linearGradient>
    <linearGradient id="g-gov-pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(110,168,254,0.2)"/>
      <stop offset="100%" stop-color="rgba(110,168,254,0.05)"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="900" fill="url(#g-gov-bg)"/>

  <g font-family="ui-monospace, monospace" font-size="11" fill="#9bb6e8" letter-spacing="1.6">
