    <text x="740" y="130" font-family="ui-monospace, monospace" font-size="12" fill="#9bb6e8" letter-spacing="1.4">NARRATIVE</text>
    <g font-family="ui-sans-serif, system-ui" font-size="14" fill="#b6c5e8">
      <text x="740" y="170">The current graphsage_xgb run continues to</text>
