      <text x="660" y="680" fill="#9bb6e8" text-anchor="end">false</text>
      <text x="100" y="710">reference_window</text>
      <text x="660" y="710" fill="#9bb6e8" text-anchor="end">2026-04-25 → 2026-05-02</text>
      <text x="100" y="740">top_drifted_features</text>
      <text x="660" y="740" fill="#9bb6e8" text-anchor="end">amount_z, channel_density</text>
      <text x="100" y="770">next_review</text>
      <text x="660" y="770" fill="#9bb6e8" text-anchor="end">2026-05-09</text>
    </g>
  </g>

