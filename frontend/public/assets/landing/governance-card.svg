    <g>
      <rect x="960" y="650" width="200" height="36" fill="url(#g-gov-pill)" stroke="rgba(110,168,254,0.4)"/>
      <text x="974" y="673" font-family="ui-monospace, monospace" font-size="11" fill="#f3f6ff">export · audit_report.md</text>
    </g>
  </g>
